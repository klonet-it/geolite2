name: Publish GeoLite.mmdb

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # Every day at 01:00 UTC

concurrency:
  group: geolite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare variables
        shell: bash
        run: |
          set -euo pipefail
          echo "TAG_NAME=latest" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=GeoLite2 DBs (latest)" >> "$GITHUB_ENV"
          echo "RELEASE_BODY=GeoLite2 ASN, City e Country (auto-updated). Last run: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Download GeoLite2 databases
        shell: bash
        env:
          LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
        run: |
          set -euo pipefail

          rm -rf tmp upload
          mkdir -p tmp upload
          cd tmp

          wget -nv -O- "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN&license_key=${LICENSE_KEY}&suffix=tar.gz" | tar xz
          wget -nv -O- "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=${LICENSE_KEY}&suffix=tar.gz" | tar xz
          wget -nv -O- "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=${LICENSE_KEY}&suffix=tar.gz" | tar xz

          cp -v GeoLite*/*.mmdb ../upload/

          (cd ../upload && sha256sum *.mmdb | sort) | sha256sum | awk '{print $1}' > ../upload/fingerprint.sha256

      - name: Check if mmdb changed vs latest release
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          PREV_FP=""

          # legge fingerprint dalla release "latest" se esiste
          if gh release view "${{ env.TAG_NAME }}" --repo "$REPO" --json assets >/dev/null 2>&1; then
            DL_URL="$(gh release view "${{ env.TAG_NAME }}" --repo "$REPO" --json assets \
              --jq '.assets[] | select(.name=="fingerprint.sha256") | .browser_download_url' || true)"

            if [ -n "${DL_URL:-}" ]; then
              curl -fsSL "$DL_URL" -o /tmp/prev_fp.txt
              PREV_FP="$(tr -d '\n' < /tmp/prev_fp.txt)"
            fi
          fi

          NEW_FP="$(tr -d '\n' < upload/fingerprint.sha256)"

          if [ -n "$PREV_FP" ] && [ "$PREV_FP" = "$NEW_FP" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected (fingerprint identical to latest release)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      # Crea o aggiorna sempre la stessa release/tag "latest"
      - name: Create/update GitHub release (only if changed)
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          TAG="${{ env.TAG_NAME }}"

          # Crea release se non esiste, altrimenti la aggiorna
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists, updating notes and assets..."
            gh release edit "$TAG" --repo "$REPO" \
              --title "${{ env.RELEASE_TITLE }}" \
              --notes "${{ env.RELEASE_BODY }}"
          else
            echo "Release $TAG does not exist, creating..."
            gh release create "$TAG" --repo "$REPO" \
              --title "${{ env.RELEASE_TITLE }}" \
              --notes "${{ env.RELEASE_BODY }}"
          fi

          # Rimpiazza gli asset (delete + upload)
          for f in upload/*.mmdb upload/fingerprint.sha256; do
            name="$(basename "$f")"
            gh release delete-asset "$TAG" "$name" --repo "$REPO" -y >/dev/null 2>&1 || true
            gh release upload "$TAG" "$f" --repo "$REPO" --clobber
          done

      # ✅ cancella run più vecchie di 5 giorni e tiene minimo 2 run
      - name: Cleanup old workflow runs (older than 5 days)
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 5
          keep_minimum_runs: 2

