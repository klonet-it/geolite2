name: Publish GeoLite.mmdb

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # Every day at 01:00 UTC

concurrency:
  group: geolite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare variables
        shell: bash
        run: |
          set -euo pipefail
          echo "TAG_NAME=$(date -u +'%Y.%m.%d')" >> "$GITHUB_ENV"

      - name: Download GeoLite2 databases
        shell: bash
        env:
          LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
        run: |
          set -euo pipefail

          rm -rf tmp upload
          mkdir -p tmp upload
          cd tmp

          wget -nv -O- "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN&license_key=${LICENSE_KEY}&suffix=tar.gz" | tar xz
          wget -nv -O- "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=${LICENSE_KEY}&suffix=tar.gz" | tar xz
          wget -nv -O- "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country&license_key=${LICENSE_KEY}&suffix=tar.gz" | tar xz

          cp -v GeoLite*/*.mmdb ../upload/

          # fingerprint deterministico dei contenuti
          (cd ../upload && sha256sum *.mmdb | sort) | sha256sum | awk '{print $1}' > ../upload/.fingerprint

      - name: Check if mmdb changed vs last release
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          PREV_FP=""

          # Prova a prendere la fingerprint dalla release più recente (se esiste)
          # Richiede GitHub CLI già presente su ubuntu-latest
          if gh release view --repo "$REPO" --json assets >/dev/null 2>&1; then
            ASSET_URL="$(gh release view --repo "$REPO" --json assets \
              --jq '.assets[] | select(.name==".fingerprint") | .url' || true)"

            if [ -n "${ASSET_URL:-}" ]; then
              gh api "${ASSET_URL}" --repo "$REPO" > /tmp/prev_fp.txt
              PREV_FP="$(cat /tmp/prev_fp.txt | tr -d '\n')"
            fi
          fi

          NEW_FP="$(cat upload/.fingerprint | tr -d '\n')"

          if [ -n "$PREV_FP" ] && [ "$PREV_FP" = "$NEW_FP" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected (fingerprint identical to last release)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      - name: Create GitHub release (only if changed)
        if: steps.changed.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: GeoLite2 DBs ${{ env.TAG_NAME }}
          body: GeoLite2 ASN, City e Country aggiornati al ${{ env.TAG_NAME }}
          files: |
            upload/*.mmdb
            upload/.fingerprint

      - name: Cleanup old releases
        if: steps.changed.outputs.changed == 'true'
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          keep_latest: 2
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 2
